<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Arthur Leance, suporte N1 na vBAM</title>
  <desc id="d">Uma conversa de suporte animada: o lojista relata que as mensagens do WhatsApp pararam, Arthur identifica o código do erro e o chamado passa de aberto para resolvido.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .b1 { animation-name: b1; }
    .typing { animation-name: typing; }
    .b2 { animation-name: b2; }
    .b3 { animation-name: b3; }
    .open { animation-name: open; opacity: 1; }
    .done { animation-name: done; }
    .dot { animation: blink 1s infinite; }
    .dot2 { animation-delay: .2s; }
    .dot3 { animation-delay: .4s; }
    @keyframes b1     { 0%,3% {opacity:0; transform:translateY(8px)} 7%,92% {opacity:1; transform:none} 97%,100% {opacity:0} }
    @keyframes typing { 0%,12% {opacity:0} 14%,28% {opacity:1} 30%,100% {opacity:0} }
    @keyframes b2     { 0%,29% {opacity:0; transform:translateY(8px)} 33%,92% {opacity:1; transform:none} 97%,100% {opacity:0} }
    @keyframes b3     { 0%,50% {opacity:0; transform:translateY(8px)} 54%,92% {opacity:1; transform:none} 97%,100% {opacity:0} }
    @keyframes open   { 0%,56% {opacity:1} 59%,100% {opacity:0} }
    @keyframes done   { 0%,57% {opacity:0} 60%,92% {opacity:1} 97%,100% {opacity:0} }
    @keyframes blink  { 0%,100% {opacity:.25} 50% {opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      .fade, .dot { animation: none !important; opacity: 1 !important; transform: none !important; }
      .typing, .open { opacity: 0 !important; }
    }
  </style>

  <!-- fundo -->
  <rect width="880" height="300" rx="20" fill="#000000"/>
  <circle cx="60" cy="300" r="140" fill="#0F1F3D"/>

  <!-- identidade -->
  <g class="sans">
    <text x="44" y="96" fill="#9CA3AF" font-size="14" font-weight="600">Suporte N1 na vBAM</text>
    <text x="42" y="146" fill="#FFFFFF" font-size="42" font-weight="800" letter-spacing="-1">Arthur Leance</text>
    <text x="44" y="186" fill="#E5E7EB" font-size="16">Transformo erro técnico em</text>
    <text x="44" y="208" fill="#E5E7EB" font-size="16">próximo passo pro lojista.</text>
    <text x="44" y="252" fill="#8B8F96" font-size="13"><tspan>VUPT Market</tspan><tspan dx="18">Vendi+</tspan><tspan dx="18">V7</tspan><tspan dx="18">Synapsia</tspan></text>
  </g>

  <!-- painel de chamado -->
  <g class="sans">
    <rect x="440" y="26" width="404" height="248" rx="16" fill="#FFFFFF"/>
    <text x="462" y="56" fill="#0B1F44" font-size="13" font-weight="700">Chamado #1042</text>
    <text x="462" y="73" fill="#6B7280" font-size="11.5">WhatsApp parou de enviar</text>

    <!-- status -->
    <g class="fade open">
      <rect x="732" y="42" width="92" height="26" rx="13" fill="#E5E7EB"/>
      <circle cx="748" cy="55" r="4" fill="#6B7280"/>
      <text x="758" y="59.5" fill="#374151" font-size="12" font-weight="600">Aberto</text>
    </g>
    <g class="fade done">
      <rect x="722" y="42" width="102" height="26" rx="13" fill="#0B1F44"/>
      <circle cx="738" cy="55" r="4" fill="#FFFFFF"/>
      <text x="748" y="59.5" fill="#FFFFFF" font-size="12" font-weight="600">Resolvido</text>
    </g>
    <line x1="462" y1="86" x2="824" y2="86" stroke="#E5E7EB"/>

    <!-- lojista -->
    <g class="fade b1">
      <rect x="462" y="100" width="238" height="44" rx="12" fill="#EEF0F2"/>
      <text x="476" y="118" fill="#111111" font-size="12.5">As mensagens do WhatsApp</text>
      <text x="476" y="135" fill="#111111" font-size="12.5">pararam de sair desde ontem.</text>
    </g>

    <!-- digitando -->
    <g class="fade typing">
      <rect x="760" y="156" width="64" height="30" rx="12" fill="#0B1F44"/>
      <circle class="dot" cx="778" cy="171" r="3.5" fill="#FFFFFF"/>
      <circle class="dot dot2" cx="792" cy="171" r="3.5" fill="#FFFFFF"/>
      <circle class="dot dot3" cx="806" cy="171" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- arthur -->
    <g class="fade b2">
      <rect x="560" y="156" width="264" height="60" rx="12" fill="#0B1F44"/>
      <text x="574" y="175" fill="#FFFFFF" font-size="12.5">Achei: código 131042, pendência de</text>
      <text x="574" y="192" fill="#FFFFFF" font-size="12.5">pagamento na Meta. Te mostro onde</text>
      <text x="574" y="209" fill="#FFFFFF" font-size="12.5">regularizar, e o envio volta sozinho.</text>
    </g>

    <!-- lojista confirma -->
    <g class="fade b3">
      <rect x="462" y="228" width="160" height="32" rx="12" fill="#EEF0F2"/>
      <text x="476" y="248" fill="#111111" font-size="12.5">Voltou! Valeu, Arthur.</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
